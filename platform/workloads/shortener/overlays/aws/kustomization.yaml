# AWS: the image comes from GHCR, built, scanned and signed (keyless) by CI.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: shortener
    newName: ghcr.io/mohamed-h-essa/shortener
    # CI pushes ghcr.io/mohamed-h-essa/shortener:sha-<commit> from main (signed keyless);
    # an AWS release is a commit that sets this tag to one of those
    newTag: sha-b2b8bd20953a7eea06a12c1ad843ca8d544ff649
patches:
  - target: {kind: Deployment, name: shortener}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: https://sho.example.com
  - target: {kind: HTTPRoute, name: shortener}
    patch: '[{"op": "replace", "path": "/spec/hostnames", "value": ["sho.example.com"]}]'
