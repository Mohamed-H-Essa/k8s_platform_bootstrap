# Prometheus, Alertmanager, Grafana and the Kubernetes exporters, trimmed for a laptop.
fullnameOverride: kps # services become kps-prometheus, kps-alertmanager, kps-grafana
crds:
  enabled: true

# kind runs these on localhost inside the control-plane node, where Prometheus can't
# scrape them: turn them off instead of living with permanently "down" targets
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }

prometheus:
  prometheusSpec:
    retention: 3d
    scrapeInterval: 15s
    # find every ServiceMonitor / PodMonitor / PrometheusRule, not only this chart's
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # keep trace ids attached to latency samples (Grafana links a slow bucket to its trace)
    enableFeatures: [exemplar-storage]
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 1Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }

prometheusOperator:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 48Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 24Mi }

grafana:
  # the admin password is not in Git: `make up` creates this Secret (.local/grafana-password)
  admin:
    existingSecret: grafana-admin
  resources:
    requests: { cpu: 25m, memory: 128Mi }
    limits: { memory: 384Mi }
  grafana.ini:
    server:
      root_url: http://grafana.localtest.me
    # read-only browsing without a login (admin: see `make urls`)
    auth.anonymous:
      enabled: true
      org_role: Viewer
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
    datasources:
      # a latency exemplar's trace_id opens the trace in Tempo
      exemplarTraceIdDestinations:
        datasourceUid: tempo
        traceIdLabelName: trace_id
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring:3100
      jsonData:
        # a trace_id in a log line becomes a link to the trace
        derivedFields:
          - name: trace_id
            matcherRegex: '"trace_id":"(\w+)"'
            url: '$${__value.raw}'
            datasourceUid: tempo
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
