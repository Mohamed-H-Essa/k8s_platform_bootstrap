# The policy engine. One replica of each controller is plenty locally.
config:
  webhooks:
    # Kyverno only sees application namespaces (label slipway.dev/policy=restricted). Its
    # webhooks fail closed, so this keeps a Kyverno outage from blocking the platform
    # itself (Argo CD, monitoring, the operators): that happened on a CPU-starved laptop.
    namespaceSelector:
      matchLabels:
        slipway.dev/policy: restricted
admissionController:
  replicas: 1
  container:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
backgroundController:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
# policy reports (background scans of everything) are off: on the laptop the reports
# controller was the busiest process on its node. Admission control is unaffected.
reportsController:
  enabled: false
cleanupController:
  enabled: false
features:
  # no report object per admission request either
  admissionReports:
    enabled: false
  registryClient:
    # the local registry speaks plain HTTP (it never leaves the laptop)
    allowInsecure: true
