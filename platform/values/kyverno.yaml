# The policy engine. One replica of each controller is plenty locally.
admissionController:
  replicas: 1
  container:
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
backgroundController:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
reportsController:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 256Mi }
cleanupController:
  enabled: false
features:
  # no report object per admission request: on a laptop that churn costs more CPU than
  # it is worth (background scan reports are still written)
  admissionReports:
    enabled: false
  registryClient:
    # the local registry speaks plain HTTP (it never leaves the laptop)
    allowInsecure: true
