# One collector in front of the tracing backend: apps only know "the collector", so the
# backend can change without touching them.
fullnameOverride: otel-collector # the service apps send to: otel-collector.monitoring
mode: deployment
image:
  repository: otel/opentelemetry-collector-contrib
resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 256Mi }
config:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: "0.0.0.0:4317" }
        http: { endpoint: "0.0.0.0:4318" }
  processors:
    memory_limiter: { check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20 }
    batch: {}
  exporters:
    otlp/tempo:
      endpoint: tempo.monitoring:4317
      tls: { insecure: true }
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp/tempo]
      metrics: null
      logs: null
