# The Gateway API implementation (ingress-nginx was retired in 2026).
# Two controllers that leave a dead node after 30 s (default 5 minutes). Chaos day: the
# only controller was on the lost node, so the Envoys kept routing to that node's pods.
deployment:
  replicas: 2
  pod:
    tolerations:
      - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: { app.kubernetes.io/name: gateway-helm }
  envoyGateway:
    # 1-second probes failed on the busy laptop and restarted the controllers in a loop;
    # every restart cut the Envoys off from their config
    startupProbe: { httpGet: { path: /healthz, port: 8081 }, periodSeconds: 2, failureThreshold: 90, timeoutSeconds: 5 }
    livenessProbe: { httpGet: { path: /healthz, port: 8081 }, periodSeconds: 20, timeoutSeconds: 10, failureThreshold: 6 }
    readinessProbe: { httpGet: { path: /readyz, port: 8081 }, periodSeconds: 10, timeoutSeconds: 5 }
    resources:
      requests: { cpu: 50m, memory: 96Mi }
      limits: { memory: 256Mi }
