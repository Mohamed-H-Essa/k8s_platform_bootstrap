# Argo CD, sized for a laptop. Terraform installs it once (infra/terraform/envs/*);
# from then on Argo CD manages everything else from Git.
global:
  domain: argocd.localtest.me

configs:
  params:
    # TLS ends at the gateway; behind it the server speaks plain HTTP
    server.insecure: true
    # chart repositories can be slow to download on a slow connection
    controller.repo.server.timeout.seconds: 300
    server.repo.server.timeout.seconds: 300
  cm:
    # check Git every 3 minutes; `make publish` asks every Application to refresh at once
    timeout.reconciliation: 180s
    # Applications report health, so the root app's sync waves wait for each layer
    # (CRDs, operators) to be Healthy before the next one starts
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil and obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs

# not needed locally: SSO, notifications, ApplicationSets
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0

controller:
  # it was OOM-killed at its 1Gi limit three times in a day; a soft Go memory limit makes it
  # collect garbage harder before the hard limit kills it
  env:
    - { name: GOMEMLIMIT, value: 850MiB }
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false # turned on by the observability layer once its CRDs exist
repoServer:
  # generous probes: on a busy laptop a 1-second health check times out and the pod is
  # restarted half way through rendering a chart
  readinessProbe: { timeoutSeconds: 10, failureThreshold: 6 }
  livenessProbe: { timeoutSeconds: 10, failureThreshold: 6, periodSeconds: 20 }
  env:
    - { name: ARGOCD_EXEC_TIMEOUT, value: 5m } # helm template of big charts on a slow laptop
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
server:
  readinessProbe: { timeoutSeconds: 10, failureThreshold: 6 }
  livenessProbe: { timeoutSeconds: 10, failureThreshold: 6, periodSeconds: 20 }
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }
redis:
  # the chart pulls Redis from ECR Public, which refused the pull on a GitHub runner (e2e);
  # the same image from Docker Hub goes through the docker.io cache like everything else
  image:
    repository: docker.io/library/redis
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }
