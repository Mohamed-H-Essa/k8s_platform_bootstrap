# AWS (EKS): Envoy behind a Network Load Balancer; the platform UIs on placeholder hosts.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - envoyproxy.yaml
patches:
  - target: { kind: HTTPRoute, name: grafana }
    patch: '[{"op": "replace", "path": "/spec/hostnames", "value": ["grafana.example.com"]}]'
  - target: { kind: HTTPRoute, name: argocd }
    patch: '[{"op": "replace", "path": "/spec/hostnames", "value": ["argocd.example.com"]}]'
  - target: { kind: HTTPRoute, name: prometheus }
    patch: '[{"op": "replace", "path": "/spec/hostnames", "value": ["prometheus.example.com"]}]'
