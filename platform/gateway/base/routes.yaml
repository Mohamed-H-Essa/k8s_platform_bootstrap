# Platform UIs. The workload's own route lives with the workload.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs: [{ name: platform, namespace: envoy-gateway-system }]
  hostnames: [grafana.localtest.me]
  rules:
    - backendRefs: [{ name: kps-grafana, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs: [{ name: platform, namespace: envoy-gateway-system }]
  hostnames: [argocd.localtest.me]
  rules:
    - backendRefs: [{ name: argocd-server, port: 80 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus
  namespace: monitoring
spec:
  parentRefs: [{ name: platform, namespace: envoy-gateway-system }]
  hostnames: [prometheus.localtest.me]
  rules:
    - backendRefs: [{ name: kps-prometheus, port: 9090 }]
