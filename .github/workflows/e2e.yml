# End to end, the same path as on a laptop: `make up` builds the whole platform (kind
# cluster via Terraform, registry and caches, Git server, Argo CD, every component, the
# signed shortener image), then `make smoke` (a link through the gateway) and
# `make unsigned` (Kyverno must refuse an unsigned image).
#
# Full profile, not a reduced one: the platform is sized for an 8 GB Docker VM and a
# standard GitHub-hosted Linux runner for a public repository has more memory than that.
# Manual, and weekly so that drift in upstream charts and images shows up.
name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

permissions: {}

concurrency:
  group: e2e
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.5.7
  TRIVY_VERSION: v0.70.0

jobs:
  up-smoke-unsigned:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # `make publish` pushes HEAD to the in-cluster Git server: no shallow clone
      - name: Free disk space for the platform's images
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # the tools `make up` and scripts/release-image.sh call (Docker, kubectl, yq, ssh
      # and curl are on the runner already)
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: sigstore/cosign-installer@v4.1.2 # `make keys` generates the local signing key
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - uses: anchore/sbom-action/download-syft@v0.24.3
      - name: make up
        run: make up
      - name: make smoke
        run: make smoke
      - name: make unsigned
        run: make unsigned
      - name: Diagnostics
        if: failure()
        run: |
          export KUBECONFIG="$PWD/.local/kubeconfig"
          kubectl -n argocd get applications || true
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -n 100 || true
      - name: make down
        if: always()
        run: make down || true
