# CI for every push and pull request:
#   go         vet + tests with the race detector
#   image      build → Trivy (fails on fixable HIGH/CRITICAL) → Syft SBOM (artifact)
#   terraform  fmt, validate both envs, tflint, trivy config (offline, nothing applied)
#   manifests  everything Argo CD would apply, rendered and schema-checked
#   workflows  actionlint
# and on main only:
#   publish    push the exact image that was scanned to GHCR, sign it and attest its
#              SBOM with cosign, keyless (GitHub OIDC → Fulcio certificate, Rekor log)
#   aws        read-only check of the shortener on EKS through an OIDC role; skipped
#              unless the repository variable AWS_ROLE_ARN is set (no account today)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# nothing by default: every job asks for exactly what it needs
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # a newer push to a pull request cancels the old run; runs on main always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/mohamed-h-essa/shortener
  TERRAFORM_VERSION: 1.5.7 # the last MPL release, what the repo is written for
  TRIVY_VERSION: v0.70.0
  HELM_VERSION: v4.1.4
  KUBECONFORM_VERSION: v0.8.0
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12

jobs:
  go:
    name: go vet + test -race
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27" # the Dockerfile builds with golang:1.27
          cache-dependency-path: app/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  image:
    name: image (build, Trivy, SBOM)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: app
          build-args: VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - name: Trivy (fails on HIGH/CRITICAL that have a fix)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE:sha-$GITHUB_SHA"
      - name: SBOM (Syft, SPDX JSON)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: ${{ env.IMAGE }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
      # publish pushes this very image (not a rebuild): what was scanned is what ships
      - name: Save the scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "$IMAGE:sha-$GITHUB_SHA" -o image.tar
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar
          retention-days: 1

  terraform:
    name: terraform (fmt, validate, tflint, trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true
      - run: terraform fmt -check -recursive infra
      - name: Validate envs/local
        run: |
          terraform -chdir=infra/terraform/envs/local init -backend=false -input=false
          terraform -chdir=infra/terraform/envs/local validate
      - name: Validate envs/aws, tflint, trivy config (make aws-check)
        run: make aws-check
        env:
          GITHUB_TOKEN: ${{ github.token }} # tflint downloads its AWS ruleset from GitHub

  manifests:
    name: manifests (helm, kustomize, kubeconform)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install kubeconform (checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          base="https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION"
          curl -sSfLO "$base/kubeconform-linux-amd64.tar.gz"
          curl -sSfLO "$base/CHECKSUMS"
          sha256sum --check --ignore-missing CHECKSUMS
          tar -xzf kubeconform-linux-amd64.tar.gz -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: scripts/lint-manifests.sh

  workflows:
    name: workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  publish:
    name: publish (GHCR, keyless cosign)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, image, terraform, manifests, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # the OIDC token cosign trades for a signing certificate
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
      - uses: actions/download-artifact@v8
        with:
          name: sbom
      - run: docker load -i image.tar
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        run: |
          docker tag "$IMAGE:sha-$GITHUB_SHA" "$IMAGE:main"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:main"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # cosign v2: its signature and attestation format is the one the cluster's Kyverno
      # verifies (the local release path uses cosign v2 for the same reason)
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v2.6.5
      - name: Sign, attest the SBOM, verify (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          ISSUER: https://token.actions.githubusercontent.com
        run: |
          ref="$IMAGE@$DIGEST"
          cosign sign --yes "$ref"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$ref"
          # what an admission policy would check: signed by this workflow on main
          identity="https://github.com/$GITHUB_WORKFLOW_REF"
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$ISSUER" "$ref" >/dev/null
          cosign verify-attestation --type spdxjson --certificate-identity "$identity" \
            --certificate-oidc-issuer "$ISSUER" "$ref" >/dev/null
          {
            echo "### Published"
            echo "\`$ref\` (tags \`sha-$GITHUB_SHA\`, \`main\`)"
            echo "signed and SBOM-attested by \`$identity\`"
          } >> "$GITHUB_STEP_SUMMARY"

  aws:
    name: aws (read-only check on EKS)
    if: vars.AWS_ROLE_ARN != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # assume the role through OIDC: no AWS keys stored anywhere
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
      - name: The shortener is rolled out and ready
        env:
          CLUSTER: ${{ vars.EKS_CLUSTER || 'slipway' }}
        run: |
          aws eks update-kubeconfig --name "$CLUSTER"
          kubectl -n shortener rollout status deployment/shortener --timeout=5m
          kubectl -n shortener get deployment shortener -o wide
